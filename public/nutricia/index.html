<meta name="apple-mobile-web-app-capable" content="yes">

<style>
:root{
  --primary:#0EA5E9; --primary-dark:#0284C7; --primary-light:#E0F2FE; --primary-lighter:#F0F9FF;
  --bg:#F8FAFC; --card:#FFFFFF; --text:#0F172A; --muted:#64748B; --border:#E2E8F0;
  --success:#10B981; --warning:#F59E0B; --danger:#EF4444;
  --radius:16px; --radius-sm:10px;
  --shadow:0 1px 3px rgba(15,23,42,.06),0 1px 2px rgba(15,23,42,.04);
  --shadow-lg:0 10px 30px rgba(14,165,233,.12);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:var(--bg); color:var(--text); font-size:16px; line-height:1.5;
  -webkit-font-smoothing:antialiased; padding-bottom:env(safe-area-inset-bottom);
}
h1,h2,h3,h4{margin:0 0 .4em; font-weight:600; line-height:1.25}
p{margin:0 0 .6em}
button{font-family:inherit; cursor:pointer; border:none; background:none}
input,select,textarea{font-family:inherit; font-size:16px; color:var(--text)}
a{color:var(--primary-dark)}
.app{max-width:480px; margin:0 auto; min-height:100vh; min-height:100dvh; background:var(--bg); position:relative}

/* Buttons */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:13px 18px;
  border-radius:var(--radius-sm); font-size:15px; font-weight:600; transition:.15s; width:100%}
.btn-primary{background:var(--primary); color:#fff}
.btn-primary:active{background:var(--primary-dark)}
.btn-ghost{background:var(--primary-light); color:var(--primary-dark)}
.btn-ghost:active{background:var(--primary)}
.btn-outline{background:#fff; color:var(--text); border:1.5px solid var(--border)}
.btn-outline:active{border-color:var(--primary)}
.btn-danger{background:#FEF2F2; color:var(--danger)}
.btn-sm{padding:8px 12px; font-size:13px; width:auto; border-radius:8px}
.btn-icon{width:40px;height:40px;padding:0;border-radius:10px;display:inline-flex;align-items:center;justify-content:center}
.btn:disabled{opacity:.5; cursor:not-allowed}

/* Inputs */
.field{margin-bottom:14px}
.field label{display:block; font-size:13px; color:var(--muted); margin-bottom:6px; font-weight:500}
.field input,.field select,.field textarea{
  width:100%; padding:12px 14px; border:1.5px solid var(--border); border-radius:var(--radius-sm);
  background:#fff; transition:.15s
}
.field input:focus,.field select:focus,.field textarea:focus{outline:none; border-color:var(--primary); box-shadow:0 0 0 3px var(--primary-light)}
.field textarea{resize:vertical; min-height:80px}
.field-row{display:flex; gap:10px}
.field-row>*{flex:1}

/* Cards */
.card{background:var(--card); border-radius:var(--radius); padding:18px; box-shadow:var(--shadow); margin-bottom:14px}
.card-tight{padding:14px}

/* Top bar */
.topbar{position:sticky; top:0; z-index:20; background:rgba(255,255,255,.92); backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border); padding:14px 16px; display:flex; align-items:center; gap:12px;
  padding-top:max(14px,env(safe-area-inset-top))}
.topbar h1{font-size:18px; margin:0; flex:1}
.topbar .logo{width:34px;height:34px;border-radius:9px;background:var(--primary);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:16px}

/* Screens */
.screen{padding:16px 16px 100px}
.screen-full{padding:0 0 100px}
.center-screen{min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:32px 24px; text-align:center}
.center-screen .logo-big{width:80px;height:80px;border-radius:20px;background:linear-gradient(135deg,var(--primary),var(--primary-dark));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:34px;margin-bottom:20px;box-shadow:var(--shadow-lg)}

/* Bottom nav */
.bottomnav{position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:480px;
  background:rgba(255,255,255,.95); backdrop-filter:blur(10px); border-top:1px solid var(--border);
  display:flex; padding:6px 4px; padding-bottom:max(6px,env(safe-area-inset-bottom)); z-index:30}
.bottomnav button{flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; padding:8px 2px;
  color:var(--muted); font-size:10px; font-weight:500; border-radius:10px}
.bottomnav button.active{color:var(--primary)}
.bottomnav button .ico{font-size:20px; line-height:1}

/* Stat / progress */
.stat-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-bottom:14px}
.stat{background:#fff; border-radius:var(--radius-sm); padding:14px; text-align:center; box-shadow:var(--shadow)}
.stat .val{font-size:22px; font-weight:700; color:var(--text)}
.stat .lbl{font-size:11px; color:var(--muted); margin-top:2px}
.stat.p .val{color:var(--primary-dark)}
.stat.f .val{color:#F59E0B}
.stat.c .val{color:#10B981}
.stat.k .val{color:#0F172A}

.ring-wrap{display:flex; align-items:center; gap:18px}
.ring{position:relative; width:110px; height:110px; flex-shrink:0}
.ring svg{transform:rotate(-90deg)}
.ring .ring-val{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center}
.ring .ring-val .num{font-size:24px; font-weight:700}
.ring .ring-val .unit{font-size:11px; color:var(--muted)}

.bar{height:8px; background:var(--border); border-radius:4px; overflow:hidden; margin:6px 0}
.bar>div{height:100%; border-radius:4px; transition:width .4s}
.bar.p>div{background:var(--primary)}
.bar.f>div{background:#F59E0B}
.bar.c>div{background:#10B981}

.macro-row{display:flex; align-items:center; gap:10px; margin-bottom:10px}
.macro-row .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.macro-row .name{font-size:13px; width:60px; color:var(--muted)}
.macro-row .vals{flex:1; font-size:13px}
.macro-row .vals b{font-weight:600}

/* Meal list */
.meal-block{background:#fff; border-radius:var(--radius); padding:14px; margin-bottom:12px; box-shadow:var(--shadow)}
.meal-block .meal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px}
.meal-block .meal-head h3{font-size:15px; margin:0}
.meal-block .meal-head .kcal{font-size:13px; color:var(--muted); font-weight:500}
.food-item{display:flex; align-items:center; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--border); font-size:14px}
.food-item:last-child{border-bottom:none}
.food-item .fi-name{flex:1}
.food-item .fi-qty{color:var(--muted); font-size:12px; margin-right:10px}
.food-item .fi-kcal{font-weight:600; font-size:13px; width:60px; text-align:right}
.food-item .fi-del{color:var(--danger); padding:4px 8px; font-size:18px; margin-left:6px}

.empty{text-align:center; padding:24px 12px; color:var(--muted); font-size:14px}
.empty .ico{font-size:36px; display:block; margin-bottom:8px; opacity:.5}

/* List items */
.list-item{display:flex; align-items:center; gap:12px; padding:14px; background:#fff; border-radius:var(--radius); margin-bottom:10px; box-shadow:var(--shadow); cursor:pointer}
.list-item:active{background:var(--primary-lighter)}
.list-item .avatar{width:44px;height:44px;border-radius:50%;background:var(--primary-light);color:var(--primary-dark);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:16px;flex-shrink:0}
.list-item .li-body{flex:1; min-width:0}
.list-item .li-title{font-weight:600; font-size:15px}
.list-item .li-sub{font-size:13px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.list-item .li-meta{font-size:11px; color:var(--muted); text-align:right; flex-shrink:0}

/* Chips */
.chips{display:flex; gap:8px; overflow-x:auto; padding:4px 0 8px; -webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{padding:7px 14px; border-radius:20px; background:#fff; border:1.5px solid var(--border); font-size:13px; white-space:nowrap; color:var(--muted)}
.chip.active{background:var(--primary); border-color:var(--primary); color:#fff}

/* Tabs */
.tabs{display:flex; background:var(--primary-light); border-radius:var(--radius-sm); padding:4px; margin-bottom:14px}
.tabs button{flex:1; padding:9px; border-radius:8px; font-size:13px; font-weight:600; color:var(--muted)}
.tabs button.active{background:#fff; color:var(--primary-dark); box-shadow:var(--shadow)}

/* Modal */
.modal-backdrop{position:fixed; inset:0; background:rgba(15,23,42,.5); z-index:50; display:flex; align-items:flex-end; justify-content:center}
.modal{background:#fff; width:100%; max-width:480px; border-radius:24px 24px 0 0; padding:20px 16px max(20px,env(safe-area-inset-bottom)); max-height:92vh; overflow-y:auto; animation:slideUp .25s}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal h2{font-size:18px; margin-bottom:14px}
.modal-handle{width:40px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 14px}

/* Chat */
.chat-wrap{display:flex; flex-direction:column; height:calc(100vh - 130px); height:calc(100dvh - 130px)}
.chat-msgs{flex:1; overflow-y:auto; padding:14px 16px; -webkit-overflow-scrolling:touch}
.msg{max-width:78%; margin-bottom:10px; padding:10px 14px; border-radius:16px; font-size:14px; word-wrap:break-word}
.msg.them{background:#fff; border-bottom-left-radius:4px; align-self:flex-start; box-shadow:var(--shadow)}
.msg.me{background:var(--primary); color:#fff; border-bottom-right-radius:4px; align-self:flex-end; margin-left:auto}
.msg .time{font-size:10px; opacity:.7; margin-top:4px; display:block}
.msg img{max-width:100%; border-radius:10px; margin-top:6px; display:block}
.chat-input{display:flex; gap:8px; padding:10px 12px max(10px,env(safe-area-inset-bottom)); background:#fff; border-top:1px solid var(--border); align-items:flex-end}
.chat-input textarea{flex:1; padding:10px 12px; border:1.5px solid var(--border); border-radius:18px; min-height:42px; max-height:100px; resize:none}
.chat-input button{width:42px;height:42px;border-radius:50%;background:var(--primary);color:#fff;font-size:18px;flex-shrink:0;display:flex;align-items:center;justify-content:center}

/* Chart */
.chart-wrap{background:#fff; border-radius:var(--radius); padding:16px; box-shadow:var(--shadow)}
.chart-svg{width:100%; height:180px}

/* Misc */
.section-title{font-size:13px; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; margin:18px 0 8px; font-weight:600; padding:0 2px}
.badge{display:inline-block; padding:3px 9px; border-radius:20px; font-size:11px; font-weight:600}
.badge-ok{background:#D1FAE5; color:#065F46}
.badge-warn{background:#FEF3C7; color:#92400E}
.badge-info{background:var(--primary-light); color:var(--primary-dark)}
.divider{height:1px; background:var(--border); margin:14px 0}
.kv{display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--border); font-size:14px}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--muted)}
.kv .v{font-weight:600}
.hint{font-size:12px; color:var(--muted); margin-top:6px}
.spin{display:inline-block;width:18px;height:18px;border:2px solid var(--primary-light);border-top-color:var(--primary);border-radius:50%;animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.toast{position:fixed; bottom:90px; left:50%; transform:translateX(-50%); background:#0F172A; color:#fff; padding:10px 18px; border-radius:20px; font-size:13px; z-index:100; animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
.hidden{display:none!important}
.right{float:right}
.muted{color:var(--muted)}
.small{font-size:13px}
.center{text-align:center}
.mt8{margin-top:8px}.mt16{margin-top:16px}.mb8{margin-bottom:8px}
.flex{display:flex}.gap8{gap:8px}.aic{align-items:center}.jcb{justify-content:space-between}
.photo-thumb{width:64px;height:64px;border-radius:10px;object-fit:cover;margin-right:8px}
</style>
</head>

/* ---------- Расчёт норм по Миффлину-Сан Жеору ---------- */
const ACTIVITY = [
  {v:1.2, t:"Сидячий (офис, нет тренировок)"},
  {v:1.375, t:"Лёгкая активность (1-3 тр./нед)"},
  {v:1.55, t:"Средняя (3-5 тр./нед)"},
  {v:1.725, t:"Высокая (6-7 тр./нед)"},
  {v:1.9, t:"Очень высокая (физ. труд + тр.)"}
];
const GOALS = [
  {v:"lose", t:"Снижение веса", adj:0.80},
  {v:"keep", t:"Поддержание", adj:1.0},
  {v:"gain", t:"Набор массы", adj:1.12}
];
function calcNorms({sex,age,weight,height,activity,goal}){
  if(!sex||!age||!weight||!height) return null;
  let bmr = 10*weight + 6.25*height - 5*age;
  bmr += (sex==="m") ? 5 : -161;
  let tdee = bmr * activity;
  const g = GOALS.find(g=>g.v===goal) || GOALS[1];
  let kcal = Math.round(tdee * g.adj);
  // БЖУ: белок 1.8 г/кг (при похудении 2.0), жиры 1 г/кг, углеводы — остаток
  let protein = Math.round(weight * (goal==="lose"?2.0:1.8));
  let fat = Math.round(weight * 1.0);
  let carb = Math.round((kcal - protein*4 - fat*9)/4);
  if(carb < 30) carb = 30;
  return {kcal, protein, fat, carb, bmr:Math.round(bmr), tdee:Math.round(tdee)};
}

/* ---------- IndexedDB слой ---------- */
const DB_NAME="ration_db", DB_VER=1, STORE="kv";
let _db=null;
function idbOpen(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open(DB_NAME,DB_VER);
    r.onupgradeneeded=e=>{const db=e.target.result;if(!db.objectStoreNames.contains(STORE))db.createObjectStore(STORE)};
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
  });
}
async function idbGet(key){
  _db=_db||await idbOpen();
  return new Promise((res,rej)=>{const tx=_db.transaction(STORE,"readonly");const r=tx.objectStore(STORE).get(key);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
}
async function idbSet(key,val){
  _db=_db||await idbOpen();
  return new Promise((res,rej)=>{const tx=_db.transaction(STORE,"readwrite");tx.objectStore(STORE).put(val,key);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)});
}
async function idbKeys(){
  _db=_db||await idbOpen();
  return new Promise((res,rej)=>{const tx=_db.transaction(STORE,"readonly");const r=tx.objectStore(STORE).getAllKeys();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
}
async function idbDel(key){
  _db=_db||await idbOpen();
  return new Promise((res,rej)=>{const tx=_db.transaction(STORE,"readwrite");tx.objectStore(STORE).delete(key);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)});
}

const Store = {

  async getClient(id){ return await idbGet("user:"+id) },

  async getClientIds(){ return (await idbGet("clients"))||[] },

  async getDiary(cid,date){ return (await idbGet(`diary:${cid}:${date}`))||[] },
  async setDiary(cid,date,items){ await idbSet(`diary:${cid}:${date}`,items) },
  async getWeight(cid){ return (await idbGet(`weight:${cid}`))||[] },
  async setWeight(cid,arr){ await idbSet(`weight:${cid}`,arr) },
  async getMenu(cid){ return (await idbGet(`menu:${cid}`))||{} },
  async setMenu(cid,m){ await idbSet(`menu:${cid}`,m) },
  async getMenuMeta(cid){ return (await idbGet(`menu:meta:${cid}`))||{mode:"day",updatedAt:null} },

  async getMessages(cid){ return (await idbGet(`messages:${cid}`))||[] },
  async setMessages(cid,arr){ await idbSet(`messages:${cid}`,arr) },
  async getNotes(cid){ return (await idbGet(`notes:${cid}`))||"" },
  async setNotes(cid,t){ await idbSet(`notes:${cid}`,t) },
  async getCustom(cid){ return (await idbGet(`custom:${cid}`))||[] },
  async setCustom(cid,arr){ await idbSet(`custom:${cid}`,arr) },
  // перебрать все ключи с префиксом (для синхронизации/экспорта)
  async keys(prefix){ const all=await idbKeys(); return all.filter(k=>String(k).startsWith(prefix)).map(k=>String(k)) },
  async exportAll(){
    const all=await idbKeys(); const out={};
    for(const k of all){ out[k]=await idbGet(k) }
    return out;
  }
};

/* ---------- Supabase sync (опционально) ---------- */
let SB_LOADED=false, SB_LIB=null;
async function loadSupabaseLib(){
  if(SB_LOADED) return SB_LIB;
  try{
    SB_LIB = await import("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm");
    SB_LOADED=true; return SB_LIB;
  }catch(e){ console.warn("Supabase lib load failed",e); return null }
}
async function ensureSupabase(){
  const cfg = await Store.getCfg();
  if(!cfg || !cfg.url || !cfg.key){ return null }
  if(state.sbClient) return state.sbClient;
  const lib = await loadSupabaseLib();
  if(!lib) return null;
  try{
    state.sbClient = lib.createClient(cfg.url, cfg.key, {auth:{persistSession:false}});
    return state.sbClient;
  }catch(e){ console.warn(e); return null }
}
/* Синхронизация: простая модель — каждое значение пишем в таблицу kv (key,text).
   SQL для Supabase прилагается в README/setup-экране. */
async function sbUpsert(key, value){
  const sb = await ensureSupabase();
  if(!sb) return false;
  try{
    const payload = JSON.stringify(value);
    await sb.from("kv").upsert({key, value: payload}, {onConflict:"key"});
    return true;
  }catch(e){ console.warn("sb upsert fail",key,e); return false }
}
async function sbFetch(key){
  const sb = await ensureSupabase();
  if(!sb) return undefined;
  try{
    const {data,error} = await sb.from("kv").select("value").eq("key",key).maybeSingle();
    if(error||!data) return undefined;
    return JSON.parse(data.value);
  }catch(e){ return undefined }
}
async function sbFetchAll(prefix){
  const sb = await ensureSupabase();
  if(!sb) return {};
  try{
    const {data,error} = await sb.from("kv").select("key,value").like("key",prefix+"%");
    if(error||!data) return {};
    const out={}; for(const r of data){ try{out[r.key]=JSON.parse(r.value)}catch{} }
    return out;
  }catch(e){ return {} }
}

  const cfg = await Store.getCfg();

  if(!session){ navigate("login"); return; }

    const doctor = await Store.getDoctor();
    if(!doctor){ navigate("login_doctor"); return; }
    state.user = doctor; navigate("doctor_home"); return;

    const c = await Store.getClient(session.cid);
    if(!c){ navigate("login_client"); return; }
    state.user = c; navigate("client_home"); return;
  }

}

  const viewerIsDoctor = !!(state.user && state.user.role==="doctor");

/* Realtime-подписка на обновления сообщений клиента.
   Возвращает функцию отписки. При изменении строки в таблице kv
   с ключом messages:<cid> — перезагружаем сообщения и перерисовываем. */
let _activeChatSub = null;
async function subscribeMessages(cid, onNew){
  // отписываемся от предыдущей подписки (если была)
  if(_activeChatSub){ try{ _activeChatSub.unsubscribe() }catch{}; _activeChatSub=null }
  const sb = await ensureSupabase();
  if(!sb) return ()=>{};
  const key = "messages:"+cid;
  try{
    // realtime по умолчанию работает на событиях postgres_changes
    const ch = sb.channel("msgs-"+cid)
      .on("postgres_changes",
          {event:"UPDATE", schema:"public", table:"kv", filter:`key=eq.${key}`},
          async (payload)=>{
            try{
              const newVal = JSON.parse(payload.new.value);
              await Store.setMessages(cid, newVal);
              onNew(newVal);
            }catch(e){ console.warn("rt parse",e) }
          })
      .on("postgres_changes",
          {event:"INSERT", schema:"public", table:"kv", filter:`key=eq.${key}`},
          async (payload)=>{
            try{
              const newVal = JSON.parse(payload.new.value);
              await Store.setMessages(cid, newVal);
              onNew(newVal);
            }catch(e){}
          })
      .subscribe();
    _activeChatSub = ch;
    return ()=>{ try{ ch.unsubscribe() }catch{}; _activeChatSub=null };
  }catch(e){ console.warn("rt sub fail",e); return ()=>{} }
}
let _activeMenuSub = null;
async function subscribeMenu(cid, onNew){
  if(_activeMenuSub){ try{ _activeMenuSub.unsubscribe() }catch{}; _activeMenuSub=null }
  const sb = await ensureSupabase();
  if(!sb) return ()=>{};
  const key = "menu:"+cid;
  try{
    const ch = sb.channel("menu-"+cid)
      .on("postgres_changes",
          {event:"*", schema:"public", table:"kv", filter:`key=eq.${key}`},
          async (payload)=>{
            try{ const v = JSON.parse(payload.new.value); onNew(v) }catch(e){}
          })
      .subscribe();
    _activeMenuSub = ch;
    return ()=>{ try{ ch.unsubscribe() }catch{}; _activeMenuSub=null };
  }catch(e){ return ()=>{} }
}

function bindChat(c, msgs, body){
  const cm = $("#cm",body), ci = $("#ci",body), cs = $("#cs",body);
  const scroll = ()=>cm.scrollTop = cm.scrollHeight;
  scroll();
  const redrawAll = (arr)=>{ cm.innerHTML = arr.map(m=>msgHtml(m,c)).join(""); scroll() };
  const send = async ()=>{
    const t = ci.value.trim(); if(!t) return;
    const m = {id:uid(), from:"doctor", text:t, time:Date.now()};
    msgs.push(m); await Store.setMessages(c.id, msgs);
    if(await ensureSupabase()) sbUpsert("messages:"+c.id, msgs);
    cm.insertAdjacentHTML("beforeend", msgHtml(m,c)); ci.value=""; ci.style.height="auto"; scroll();
  };
  cs.onclick = send;
  ci.onkeydown = e=>{ if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); send() } };
  ci.oninput = ()=>{ ci.style.height="auto"; ci.style.height=ci.scrollHeight+"px" };
  // realtime: когда клиент пишет — перерисовываем
  subscribeMessages(c.id, (newArr)=>{
    // сколько сообщений было до — определяем новые
    const prev = cm.querySelectorAll(".msg").length;
    if(newArr.length > prev){
      redrawAll(newArr);
    }
  });
}

  let mode = meta.mode||"day";
  let curDay = 0; // индекс дня недели для week-режима
  function draw(){
    const body = $("#menu_body",a);
    if(mode==="day"){
      const date = state.sub.date || todayStr();
      const items = menu[date]||[];
      body.innerHTML = `
        <div class="card"><div class="flex jcb aic mb8"><b>${fmtDateFull(date)}</b><input type="date" id="md_date" value="${date}"></div></div>
        ${meals.map(mn=>{
          const its = items.filter(x=>x.meal===mn);
          return `<div class="meal-block">
            <div class="meal-head"><h3>${mn}</h3><button class="btn btn-ghost btn-sm" data-add="${mn}">+ блюдо</button></div>
            ${its.length?its.map((it,i)=>`<div class="food-item"><div class="fi-name">${esc(it.name)} <span class="fi-qty">· ${it.qty} г</span></div><button class="fi-del" data-del="${mn}:${i}">×</button></div>`).join(""):`<div class="small muted">Пусто</div>`}
            ${it_note(its)}
          </div>`;
        }).join("")}
        <button class="btn btn-primary mt8" id="b_save">Сохранить</button>`;
      // NOTE: it_note placeholder defined below
    } else {
      // недельное меню
      body.innerHTML = `
        <div class="chips mb8">${days.map((d,i)=>`<button class="chip ${i===curDay?"active":""}" data-day="${i}">${d}</button>`).join("")}</div>
        ${meals.map(mn=>{
          const dayKey = "w"+curDay;
          const items = (menu[dayKey]||[]).filter(x=>x.meal===mn);
          return `<div class="meal-block">
            <div class="meal-head"><h3>${mn}</h3><button class="btn btn-ghost btn-sm" data-addw="${mn}">+ блюдо</button></div>
            ${items.length?items.map((it,i)=>`<div class="food-item"><div class="fi-name">${esc(it.name)} <span class="fi-qty">· ${it.qty} г</span></div><button class="fi-del" data-delw="${mn}:${i}">×</button></div>`).join(""):`<div class="small muted">Пусто</div>`}
          </div>`;
        }).join("")}
        <button class="btn btn-primary mt8" id="b_save">Сохранить</button>`;
    }
  }
  function it_note(its){ return "" } // заметки по приёму — упрощённо
  draw();

  // переключение режимов
  $("#m_day",a).onclick = async ()=>{ mode="day"; await Store.setMenuMeta(cid,{mode,updatedAt:Date.now()}); $$("#menu_body",a); $$(".tabs button",a).forEach(b=>b.classList.remove("active")); $("#m_day",a).classList.add("active"); draw() };
  $("#m_week",a).onclick = async ()=>{ mode="week"; await Store.setMenuMeta(cid,{mode,updatedAt:Date.now()}); $$(".tabs button",a).forEach(b=>b.classList.remove("active")); $("#m_week",a).classList.add("active"); draw() };
  // делегирование
  $("#menu_body",a).onclick = async (e)=>{
    const t = e.target;
    if(t.dataset.day!==undefined){ curDay=+t.dataset.day; draw() }
    else if(t.dataset.add){ openFoodPicker(c, async (sel)=>{ const date=state.sub.date||todayStr(); const arr=menu[date]||[]; arr.push({meal:t.dataset.add, name:sel.name, qty:sel.qty}); menu[date]=arr; await Store.setMenu(cid,menu); draw() }) }
    else if(t.dataset.addw){ openFoodPicker(c, async (sel)=>{ const dk="w"+curDay; const arr=menu[dk]||[]; arr.push({meal:t.dataset.addw, name:sel.name, qty:sel.qty}); menu[dk]=arr; await Store.setMenu(cid,menu); draw() }) }
    else if(t.dataset.del){ const [mn,i]=t.dataset.del.split(":"); const date=state.sub.date||todayStr(); const arr=(menu[date]||[]); const idx = arr.findIndex((x,idx)=>x.meal===mn && idx>=0); /* удалить i-й элемент этого meal */ const filtered = arr.filter((x,idx)=>!(x.meal===mn && idx===+i+arr.filter((y,yy)=>y.meal===mn&&yy<i).length)); /* упрощаем: удаляем по индексу в meal-группе */ ; menu[date]=filtered; await Store.setMenu(cid,menu); draw() }
    else if(t.dataset.delw){ const [mn,i]=t.dataset.delw.split(":"); const dk="w"+curDay; const arr=menu[dk]||[]; const filtered=arr.filter((x,idx)=>!(x.meal===mn&&idx===+i)); menu[dk]=filtered; await Store.setMenu(cid,menu); draw() }
    else if(t.id==="b_save"){ if(await ensureSupabase()) await sbUpsert("menu:"+cid, menu); toast("Меню сохранено"); }
    else if(t.id==="md_date"){ state.sub.date = t.value; draw() }
  };
  $("#menu_body",a).oninput = (e)=>{ if(e.target.id==="md_date"){ state.sub.date = e.target.value; draw() } };
}

/* Универсальный выбор блюда из базы */
function openFoodPicker(client, onPick){
  const m = document.createElement("div"); m.className="modal-backdrop";
  let curCat = "Все";
  let q = "";
  const all = [...FOOD_DB, ...(client?[]:[])];
  function list(){
    let arr = all.filter(f=> curCat==="Все"||f.cat===curCat);
    if(q) arr = arr.filter(f=> f.n.toLowerCase().includes(q.toLowerCase()));
    return arr;
  }
  function body(){
    const arr = list();
    return `
      <div class="modal-handle"></div>
      <h2>Добавить блюдо</h2>
      <div class="field"><input id="fp_q" placeholder="Поиск..." value="${esc(q)}"></div>
      <div class="chips"><button class="chip ${curCat==="Все"?"active":""}" data-cat="Все">Все</button>${FOOD_CATS.map(c=>`<button class="chip ${curCat===c?"active":""}" data-cat="${c}">${c}</button>`).join("")}</div>
      <div style="max-height:50vh;overflow-y:auto">
        ${arr.length?arr.map(f=>`<div class="list-item" data-food="${f.n}"><div class="li-body"><div class="li-title">${esc(f.n)}</div><div class="li-sub">${f.k} ккал · Б${f.p}/Ж${f.f}/У${f.c} · на 100 г</div></div></div>`).join(""):`<div class="empty">Не найдено</div>`}
      </div>
      <div id="fp_qty_wrap" class="hidden">
        <div class="card mt8"><div class="field"><label>Количество, г</label><input id="fp_qty" type="number" value="100" inputmode="numeric"></div><button class="btn btn-primary" id="fp_ok">Добавить</button></div>
      </div>`;
  }
  m.innerHTML = `<div class="modal" onclick="event.stopPropagation()">${body()}</div>`;
  m.onclick = ()=>m.remove();
  document.body.appendChild(m);
  let selected = null;
  function refresh(){ $(".modal",m).innerHTML = body(); bind() }
  function bind(){
    $("#fp_q",m).oninput = (e)=>{ q=e.target.value; refresh(); $("#fp_q",m).focus() };
    $$(".chip",m).forEach(c=>c.onclick=()=>{ curCat=c.dataset.cat; refresh() });
    $$(".list-item",m).forEach(el=>el.onclick=()=>{
      selected = all.find(f=>f.n===el.dataset.food);
      $("#fp_qty_wrap",m).classList.remove("hidden");
      $("#fp_qty",m).focus();
    });
    if($("#fp_ok",m)) $("#fp_ok",m).onclick=()=>{
      const qty = +$("#fp_qty",m).value||100;
      m.remove();
      onPick({name:selected.n, qty, kcal:Math.round(selected.k*qty/100), p:round1(selected.p*qty/100), f:round1(selected.f*qty/100), c:round1(selected.c*qty/100)});
    };
  }
  bind();
}

async function clientMenuToday(c){
  const menu = await Store.getMenu(c.id);
  const meta = await Store.getMenuMeta(c.id);
  const date = todayStr();
  let items = [];
  if(meta.mode==="week"){
    const dow = (new Date().getDay()+6)%7; // пн=0
    items = menu["w"+dow]||[];
  } else {
    items = menu[date]||[];
  }
  const meals = ["Завтрак","Обед","Перекус","Ужин"];
  let html = "";
  for(const m of meals){
    const its = items.filter(x=>x.meal===m);
    if(!its.length) continue;
    html += `<div class="meal-block"><div class="meal-head"><h3>${m}</h3></div>${its.map(it=>`<div class="food-item"><div class="fi-name">${esc(it.name)}</div><div class="fi-qty">${it.qty} г</div></div>`).join("")}</div>`;
  }
  if(!html) html = `<div class="empty"><span class="ico">📋</span>Врач ещё не составил меню</div>`;
  return {html};
}

async function renderClientChat(a){
  const c = state.user;
  if(!c||c.role!=="client"){ navigate("client_home"); return }
  const msgs = await Store.getMessages(c.id);
  // отметить прочитанными
  let changed=false; msgs.forEach(m=>{ if(m.from==="doctor"&&!m.read){m.read=true;changed=true} });
  if(changed){ await Store.setMessages(c.id,msgs); if(await ensureSupabase()) sbUpsert("messages:"+c.id,msgs) }
  a.innerHTML = `
    <div class="topbar">
      <button class="btn-icon btn-outline" onclick="navigate('client_home')">←</button>
      <h1>Чат с врачом</h1>
    </div>
    <div class="chat-wrap">
      <div class="chat-msgs" id="cm">
        ${msgs.length?msgs.map(m=>msgHtml(m,c)).join(""):`<div class="empty"><span class="ico">💬</span>Напишите врачу — он ответит в течение дня</div>`}
      </div>
      <div class="chat-input">
        <textarea id="ci" placeholder="Сообщение..." rows="1"></textarea>
        <button id="cp">📷</button>
        <button id="cs">➤</button>
      </div>
    </div>
  `;
  const cm = $("#cm",a); cm.scrollTop = cm.scrollHeight;
  const ci = $("#ci",a);
  const send = async ()=>{
    const t = ci.value.trim(); if(!t) return;
    const m = {id:uid(), from:"client", text:t, time:Date.now(), read:false};
    msgs.push(m); await Store.setMessages(c.id, msgs);
    if(await ensureSupabase()) sbUpsert("messages:"+c.id, msgs);
    cm.insertAdjacentHTML("beforeend", msgHtml(m,c)); ci.value=""; ci.style.height="auto"; cm.scrollTop=cm.scrollHeight;
  };
  $("#cs",a).onclick = send;
  ci.onkeydown = e=>{ if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); send() } };
  ci.oninput = ()=>{ ci.style.height="auto"; ci.style.height=ci.scrollHeight+"px" };
  $("#cp",a).onclick = ()=>{
    const inp = document.createElement("input"); inp.type="file"; inp.accept="image/*"; inp.capture="environment";
    inp.onchange = async ()=>{
      const f = inp.files[0]; if(!f) return;
      if(f.size>1500000){ toast("Фото слишком большое (макс 1.5 МБ)"); return }
      const url = await fileToDataUrl(f);
      const m = {id:uid(), from:"client", photo:url, text:"", time:Date.now(), read:false};
      msgs.push(m); await Store.setMessages(c.id, msgs);
      if(await ensureSupabase()) sbUpsert("messages:"+c.id, msgs);
      cm.insertAdjacentHTML("beforeend", msgHtml(m,c)); cm.scrollTop=cm.scrollHeight;
    };
    inp.click();
  };
  // realtime: врач пишет — перерисовываем, если появились новые сообщения
  subscribeMessages(c.id, (newArr)=>{
    const prev = cm.querySelectorAll(".msg").length;
    if(newArr.length > prev){
      // отметить прочитанными новые от врача
      newArr.forEach(m=>{ if(m.from==="doctor") m.read=true });
      cm.innerHTML = newArr.map(m=>msgHtml(m,c)).join("");
      cm.scrollTop = cm.scrollHeight;
      Store.setMessages(c.id, newArr);
      if(ensureSupabase()) sbUpsert("messages:"+c.id, newArr);
    }
  });
}

      <div class="section-title">Экспорт данных</div>
      <div class="card"><button class="btn btn-outline" id="b_export">Скачать все данные (JSON)</button></div>

      await Store.setDoctor(doctor);

    };
  }
  $("#b_export",a).onclick = async ()=>{
    const data = await Store.exportAll();

  };

/* ---------- График веса (SVG) ---------- */
function makeWeightChart(w){
  if(!w||w.length<2) return "";
  const vals = w.map(x=>x.weight);
  const min = Math.min(...vals)-1, max = Math.max(...vals)+1;
  const W=320,H=160, pad=24;
  const x = i => pad + i*(W-2*pad)/(w.length-1);
  const y = v => H-pad - (v-min)/(max-min)*(H-2*pad);
  const path = w.map((p,i)=>`${i===0?"M":"L"}${x(i)},${y(p.weight)}`).join(" ");
  const area = `${path} L${x(w.length-1)},${H-pad} L${x(0)},${H-pad} Z`;
  const delta = (vals[vals.length-1]-vals[0]).toFixed(1);
  const col = delta<0?"#10B981":delta>0?"#EF4444":"#64748B";
  return `<div class="chart-wrap"><div class="flex jcb aic mb8"><b>Динамика веса</b><span class="badge" style="background:${col}22;color:${col}">${delta>0?"+":""}${delta} кг</span></div>
    <svg class="chart-svg" viewBox="0 0 ${W} ${H}">
      <defs><linearGradient id="g" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#0EA5E9" stop-opacity=".3"/><stop offset="1" stop-color="#0EA5E9" stop-opacity="0"/></linearGradient></defs>
      <path d="${area}" fill="url(#g)"/>
      <path d="${path}" fill="none" stroke="#0EA5E9" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
      ${w.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.weight)}" r="3" fill="#fff" stroke="#0EA5E9" stroke-width="2"/>`).join("")}
      ${w.map((p,i)=>`<text x="${x(i)}" y="${H-6}" font-size="9" fill="#64748B" text-anchor="middle">${fmtDate(p.date).replace(" ","")}</text>`).join("")}
      <text x="${pad-4}" y="${y(vals[0])-6}" font-size="10" fill="#0F172A" text-anchor="end" font-weight="600">${vals[0]}</text>
      <text x="${x(w.length-1)}" y="${y(vals[vals.length-1])-6}" font-size="10" fill="#0F172A" text-anchor="end" font-weight="600">${vals[vals.length-1]}</text>
    </svg></div>`;
}

/* ---------- Кольцо прогресса (SVG) ---------- */
function makeRing(val, target, label, size=110){
  const pct = target>0 ? clamp(val/target,0,1) : 0;
  const r = (size-12)/2, c = 2*Math.PI*r;
  const off = c*(1-pct);
  const col = pct>=1?"#10B981":pct>0.85?"#F59E0B":"#0EA5E9";
  return `<div class="ring" style="width:${size}px;height:${size}px">
    <svg width="${size}" height="${size}">
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#E2E8F0" stroke-width="9"/>
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${col}" stroke-width="9"
        stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 ${size/2} ${size/2})"/>
    </svg>
    <div class="ring-val"><div class="num" style="font-size:${size*0.22}px">${val}</div><div class="unit">${label}</div></div>
  </div>`;
}
