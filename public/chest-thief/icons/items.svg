<!-- Свиток -->
<symbol id="icon-scroll" viewBox="0 0 32 32">
<rect x="8" y="8" width="16" height="16" rx="2" stroke="currentColor" stroke-width="1.5" fill="currentColor" fill-opacity="0.2"/>
<path d="M12 12 L20 12 M12 16 L20 16 M12 20 L18 20" stroke="currentColor" stroke-width="0.8"/>
