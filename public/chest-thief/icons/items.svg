<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
<!-- Меч -->
<symbol id="icon-sword" viewBox="0 0 32 32">
<path d="M16 4 L16 22 M12 22 L20 22 M14 22 L14 26 L18 26 L18 22" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>
<path d="M16 4 L14 8 L18 8 Z" fill="currentColor"/>
</symbol>
<!-- Кинжал -->
<symbol id="icon-dagger" viewBox="0 0 32 32">
<path d="M16 6 L16 20 M13 20 L19 20 M15 20 L15 24 L17 24 L17 20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>
